# §10.5's shared validation module, as its own workspace member for the reason `knowledge`
# is one: three consumers -- the analysis service, the agent and the MCP server -- and none
# of them may depend on either of the others. A copy of the token rules in each would be
# three readings of one claim shape, and the one place in this system where nobody should
# own more code than they must.
[project]
name = "auth"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    # Signature verification, and the reason it is a dependency rather than code here: the
    # standard library has no JOSE support at all, so "no new dependency" would mean writing
    # RSASSA-PKCS1-v1_5 verification, base64url decoding and claim validation by hand -- the
    # one kind of code where a subtle mistake is silent and total. PyJWT is already resolved
    # in this workspace (the MCP SDK's OAuth client pulls it), so this pin adds an edge to
    # the graph rather than a package to the images.
    "pyjwt[crypto]==2.14.0",
    # §10.3: every number is configuration. Same settings machinery as every other package.
    "pydantic-settings==2.15.0",
    # `Request`, `HTTPException` and the ASGI types. Starlette rather than FastAPI because
    # the MCP server is a Starlette application and has no FastAPI in its image -- and
    # FastAPI handles a Starlette `HTTPException` with the same handler it uses for its own.
    "starlette==1.6.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    # Starlette's own TestClient, for the middleware the MCP server mounts. It is httpx that
    # the TestClient needs; the same pin the other three packages already carry.
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
