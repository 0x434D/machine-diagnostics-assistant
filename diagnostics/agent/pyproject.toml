[project]
name = "agent"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "anthropic==1.5.0",
    "httpx==0.28.1",
    "pydantic-settings==2.15.0",
    # §8: the agent's `agent.*` schema is Python-written, Python-read and Python-modelled,
    # and Alembic owns it. The gateway's migrations are embedded SQL applied by the C#
    # process and cannot reach a schema that is not the gateway's -- two tools over disjoint
    # schemas is the ownership boundary made visible. psycopg is the driver the analysis
    # service already uses; SQLAlchemy arrives as Alembic's own requirement, and adding
    # psycopg2 for it would be a second Postgres driver in one stack.
    "alembic==1.20.0",
    "psycopg[binary]==3.3.5",
    # §6.2's loader, shared with the analysis service and (M4 Task 7) the MCP server.
    "knowledge",
]

[tool.uv.sources]
knowledge = { workspace = true }

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    # Real Postgres, for the same reason the analysis package runs one: a grant boundary
    # asserted against a fake is a statement about the fake.
    "testcontainers[postgres]==4.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Authenticity proofs stop and start real containers and take minutes. `make check` must stay
# fast and side-effect free, so they are excluded by default and run by `make verify`.
markers = ["authenticity: §1's proofs — stops containers, minutes long (make verify)"]
addopts = "-m 'not authenticity'"
