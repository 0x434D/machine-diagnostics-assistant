# Alembic, and it reaches exactly one schema in this database.
#
# §8 of docs/ENGINEERING.md: one migration set per owner. The gateway's `ingest` and `read`
# are plain SQL embedded in the C# binary and applied by it; `agent.*` is Python-written,
# Python-read and Python-modelled, and Alembic owns it. Two tools over disjoint schemas is
# the ownership boundary made visible, not fragmentation -- so nothing in this directory may
# name a relation outside `agent`.
#
# Applying it takes two identities, for a reason that is not configuration and cannot be
# tidied away: revision 0001 creates the `agent` role, and a role cannot create itself.
#
#     AGENT_DATABASE_URL=$OWNER_URL alembic -c agent/alembic.ini upgrade 0001
#     alembic -c agent/alembic.ini upgrade head
#
# The second line is the one that matters for correctness rather than for bootstrap: 0001
# sets `search_path` on the *role*, so every revision after it lands in `agent` only because
# `agent` is who connects. `alembic/env.py` carries the whole argument, and
# `diagnostics/compose.yml` runs exactly these two commands as the agent's pre_start step.

[alembic]
script_location = %(here)s/alembic
# `os`, so the tests can name a second version directory with os.pathsep.
path_separator = os

# No `sqlalchemy.url` key, and its absence is deliberate twice over. The URL carries a
# credential and this file is in the repository; and one source for it -- AGENT_DATABASE_URL,
# read through agent.config.Settings in env.py -- means the identity a migration runs as is
# stated in the environment that starts it rather than in two places that can disagree.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

# INFO, so a deployment that applies a migration says which one. A migration step that
# succeeds silently is indistinguishable from one that did not run.
[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
