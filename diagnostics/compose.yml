name: machine-agent-diagnostics

# Same uid discipline as the plant, and for the same reason: the gateway reads its own
# private key out of the bind-mounted `pki/`, and `simulator.pki` writes those 0600. A
# container running as anyone else fails in a way that reads as a missing certificate
# rather than as a permissions problem -- see plant/.env.example.
x-runtime: &runtime
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# §10.5's three settings, shared by every service that validates a token, because there is
# exactly one issuer and one claim shape and a service configured for a second one would be
# a second identity system inside the boundary that exists to have only one.
#
# **The public key has no default and that is deliberate.** `auth.Settings` fails closed --
# a service that was never given a key refuses everything -- and a default here would be
# either a committed key (a credential in the repository) or a placeholder that turns the
# failure into a puzzle. There *is* an issuer container since M6 (`issuer`, below), and the
# validators still read their key from here rather than fetching its JWKS document -- see
# that service's comment for why the half-change was not made. `scripts/mint-token.py` owns
# the keypair: `--public-key` prints what goes here, `--private-key` what goes into the
# issuer, and the pair it writes is gitignored. Put AUTH_PUBLIC_KEY in `diagnostics/.env`,
# which is gitignored too.
#
# Nothing in this block is shared with the plant stack, and nothing in it ever may be: the
# plant's one privileged action is gated by a secret in *its* `.env`, and two identity
# mechanisms disjoint by construction is what keeps the two-stack split from acquiring a
# second channel across it (§10.5, CLAUDE.md's fifth invariant).
x-auth: &auth
  AUTH_PUBLIC_KEY: "${AUTH_PUBLIC_KEY:-}"
  AUTH_AUDIENCE: "${AUTH_AUDIENCE:-machine-agent}"
  AUTH_ISSUER: "${AUTH_ISSUER:-https://issuer.test/machine-agent}"

services:
  postgres:
    <<: *runtime
    image: postgres:17-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
    # Postgres writes its own runtime files; read_only from the shared block would stop it.
    read_only: false
    # The shared block's uid exists for one reason: the gateway has to be whoever owns the
    # bind-mounted pki/. Postgres never touches that, and running as a foreign uid leaves it
    # unable to chmod its own data directory -- initdb fails with "Operation not permitted".
    user: postgres
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-diagnostics}"
      POSTGRES_DB: diagnostics
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "diagnostics"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - diagnostics-db:/var/lib/postgresql/data
    networks: [diag-net] # never field-net: nothing but OPC UA crosses to the plant

  edge-gateway:
    <<: *runtime
    build:
      # The repository root, because Directory.Build.props and global.json live there and
      # carry the target framework, the analyzer set and the SDK pin.
      context: ..
      dockerfile: diagnostics/gateway/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The same three AUTH_* names the Python services above read, and the same block. The
      # gateway validates the token in C# because it cannot import `diagnostics/auth` (§2.3),
      # and that second implementation is held to the first by the shared fixtures in
      # `diagnostics/auth/fixtures/tokens.json` -- but only if both are pointed at one issuer,
      # which is what sharing this anchor rather than writing GATEWAY_AUDIENCE achieves.
      <<: *auth
      # Restated here rather than left to GatewayOptions' defaults so the one name this
      # boundary is built around is visible in the file that joins the network.
      GATEWAY_ENDPOINT_URL: "opc.tcp://line-simulator:4840/plant"
      GATEWAY_APPLICATION_URI: "urn:machine-agent:diagnostics:edge-gateway"
      GATEWAY_SECURITY_MODE: "Sign"
      GATEWAY_PKI_ROOT: "/pki"
      GATEWAY_QUEUE_PATH: "/queue/gateway.db"
      # Stated beside the mount below, because the two have to name the same path and a
      # gateway that cannot find its policy refuses to start.
      GATEWAY_SIGNAL_POLICY: "/config/signals.json"
      GATEWAY_POSTGRES: "Host=postgres;Username=postgres;Password=${POSTGRES_PASSWORD:-diagnostics};Database=diagnostics"
      # The credential for the reader role 005_m3_read_layer.sql creates. The migration
      # creates that role without a password deliberately -- a literal in an embedded SQL
      # resource is a credential compiled into the image -- and the gateway holds the only
      # connection privileged enough to set one. Same shape and same override path as
      # POSTGRES_PASSWORD above: a development default here, a real value through .env.
      GATEWAY_ANALYSIS_PASSWORD: "${ANALYSIS_DB_PASSWORD:-analysis}"
    volumes:
      - ../pki:/pki:ro
      # §5.1's per-signal deadbands, mounted rather than built in: they are tuned against
      # jitter measured on a particular plant, and a rebuild is the wrong unit of change
      # for that. Read-only -- the gateway never writes its own configuration.
      - ./gateway/Gateway/config/signals.json:/config/signals.json:ro
      - gateway-queue:/queue
    ports:
      # Every number is configuration (§10.3). The default is what the README and the
      # demo use; override when the host already has something on it.
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    networks: [diag-net, field-net] # the only diagnostics container that may join field-net

  analysis:
    <<: *runtime
    build:
      # The repository root, because `knowledge/` lives there -- top level and deliberately
      # (§10.1), because it is what a domain expert edits. §5.3 puts GET /knowledge/{id} on
      # this service, so the documents have to be in the context; see diagnostics/Dockerfile.
      context: ..
      dockerfile: diagnostics/Dockerfile
      args: { PACKAGE: analysis }
    command:
      ["uvicorn", "analysis.app:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *auth
      # `analysis`, never `postgres`: the role 005_m3_read_layer.sql creates holds USAGE on
      # `read`, SELECT on its views and nothing else anywhere. Sharing the gateway's
      # superuser here -- which is what this line said until M3 -- made §5.2's "reads views
      # and cannot write" a claim about the SQL in this service rather than about the
      # database, and left nothing to stop the next query written here from writing.
      #
      # The role exists once the gateway has applied the schema, so on a first boot this
      # service's pool retries until then rather than answering. depends_on is deliberately
      # not widened to the gateway: the analysis service must keep answering when the
      # gateway is gone (§2.2), and a start-order edge would read as though it did not.
      ANALYSIS_DATABASE_URL: "postgresql://analysis:${ANALYSIS_DB_PASSWORD:-analysis}@postgres:5432/diagnostics"
      # Where the Dockerfile laid the documents down. Stated rather than left to the module
      # default, which resolves relative to the source tree and is right only by arithmetic.
      ANALYSIS_KNOWLEDGE_ROOT: "/knowledge"
    ports:
      - "127.0.0.1:${ANALYSIS_PORT:-8000}:8000"
    # diag-net to reach Postgres, edge-net to be reachable from the host. It has never
    # heard of OPC UA and never joins field-net.
    networks: [diag-net, edge-net]

  agent:
    <<: *runtime
    build:
      # The repository root, for the same reason the analysis service builds from it: §6.2
      # routes from the documents in `knowledge/`, one level above this file.
      context: ..
      dockerfile: diagnostics/Dockerfile
      args: { PACKAGE: agent }
    command: ["uvicorn", "agent.app:app", "--host", "0.0.0.0", "--port", "8001"]
    depends_on:
      analysis:
        condition: service_started
      # Not for the answers -- those come from the analysis service, which keeps answering
      # when everything else is gone -- but because the migration step below has nothing to
      # apply against until Postgres is accepting connections.
      postgres:
        condition: service_healthy
    environment:
      <<: *auth
      AGENT_ANALYSIS_URL: "http://analysis:8000"
      AGENT_KNOWLEDGE_ROOT: "/knowledge"
      # §8's second writer. `agent`, never `postgres` and never `analysis`: the role
      # migration 0001 creates owns `agent.*`, holds nothing in `ingest` or `read`, and is
      # refused by the database rather than by a review comment if it reaches for either.
      # Same shape and same override path as ANALYSIS_DATABASE_URL above -- a development
      # default here, a real value through .env.
      AGENT_DATABASE_URL: "postgresql://agent:${AGENT_DB_PASSWORD:-agent}@postgres:5432/diagnostics"
      # "scripted" needs no credentials and reaches no network. Set to "anthropic" and
      # provide ANTHROPIC_API_KEY through .env (which is gitignored) to use a real model.
      AGENT_PROVIDER: "${AGENT_PROVIDER:-scripted}"
    env_file:
      - path: .env
        required: false
    # Migrations as a pre_start step, never from the service's own entrypoint (§8): a
    # migration that runs at startup races across replicas, and it is the wrong thing to
    # retry when the process it belongs to is the one answering questions.
    #
    # Two steps, because they run as two roles, and that is the ownership boundary rather
    # than a deployment quirk:
    #
    #   1. 0001 creates the `agent` role, which no role can do for itself, and hands it the
    #      password this deployment reaches it with. The owner's credential exists for the
    #      length of this hook's process and is never given to the service.
    #   2. Everything after 0001 is applied *as* `agent`, whose `search_path` 0001 set to
    #      its own schema. That is what keeps an unqualified `CREATE TABLE` in a later
    #      revision out of the gateway's `ingest` -- 005_m3_read_layer.sql's warning, and
    #      alembic/env.py carries the argument in full.
    pre_start:
      - command: ["alembic", "-c", "agent/alembic.ini", "upgrade", "0001"]
        environment:
          AGENT_DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-diagnostics}@postgres:5432/diagnostics"
          AGENT_ROLE_PASSWORD: "${AGENT_DB_PASSWORD:-agent}"
      - command: ["alembic", "-c", "agent/alembic.ini", "upgrade", "head"]
    ports:
      - "127.0.0.1:${AGENT_PORT:-8001}:8001"
    # diag-net for the analysis service and its own schema in Postgres, edge-net to be
    # reachable from the host. It has never heard of OPC UA and never joins field-net.
    networks: [diag-net, edge-net]

  # §6.11's MCP server. It is the second binding over one contract: the UI binds the analysis
  # service over REST, agent runtimes bind the same operations over MCP, and both come from
  # `contracts/analysis.openapi.yaml`. Read-only, every tool, and there is deliberately no
  # plant-side counterpart -- operating the plant agentically would let the diagnostics side
  # know what it broke and destroy the evaluation.
  mcp:
    <<: *runtime
    build:
      # The repository root, for both reasons the other two Python services build from it:
      # §6.2's documents in `knowledge/` are the resources this server exposes, and
      # `contracts/` is where it generates its tool list from.
      context: ..
      dockerfile: diagnostics/Dockerfile
      args: { PACKAGE: mcp-server }
    # The package's own entry point rather than a uvicorn command line: it reads the host and
    # the port out of the settings below, so there is one place each number lives (§10.3)
    # instead of two that have to be kept saying the same thing.
    command: ["mcp-server"]
    depends_on:
      analysis:
        condition: service_started
      agent:
        condition: service_started
    environment:
      <<: *auth
      MCP_ANALYSIS_URL: "http://analysis:8000"
      MCP_AGENT_URL: "http://agent:8001"
      # Where the Dockerfile laid each of them down. Stated rather than left to the module
      # defaults, which resolve relative to the source tree and are right only by arithmetic.
      MCP_KNOWLEDGE_ROOT: "/knowledge"
      MCP_CONTRACT: "/contracts/analysis.openapi.yaml"
      # The container has to listen on its own interface to be reachable through the port
      # published below; §6.11's "bound to localhost" is held by that publish being
      # loopback-only and by diag-net being internal, not by this line. The module default is
      # the loopback address, so a run from a checkout is bound the way the spec asks without
      # being told.
      MCP_HOST: "0.0.0.0"
    ports:
      # Every number is configuration (§10.3), and 127.0.0.1 is not an accident: this is the
      # endpoint an external agent connects to, and it is reachable from this host only.
      - "127.0.0.1:${MCP_PORT:-8002}:8002"
    # diag-net to reach the analysis service and the agent, edge-net to be reachable from the
    # host. It has never heard of OPC UA and never joins field-net -- §6.11 says so twice and
    # it is the one claim the whole architecture exists to support.
    networks: [diag-net, edge-net]

  # §10.5's issuer, in development form. **A service since M6, and this file said the
  # opposite until then**: M5 was ruled slim and `scripts/mint-token.py` carried the note
  # that it must not become a fourth container. The human ruling of 2026-09-19 reverses it,
  # because M6's first line is a login and a field you paste a token into is not one. Zitadel
  # replaces this by configuration (§10.5) and this block goes with it.
  #
  # **The validators are not pointed at its JWKS document.** It serves one -- that is what an
  # issuer offers and what `auth.config` names as Zitadel's arrival point -- but the analysis
  # service, the agent, the MCP server and the gateway all still verify against the
  # configured AUTH_PUBLIC_KEY above. Moving four validators onto a fetched key set brings a
  # startup order, a cache and a failure mode with it; doing half of it would leave the stack
  # with two answers to "which key is trusted", which is worse than either answer alone.
  issuer:
    <<: *runtime
    build:
      # The repository root, like the other three Python services: one Dockerfile per stack,
      # parameterised on the package. This service reads neither `knowledge/` nor
      # `contracts/`, but a second Dockerfile to omit them would be a second image shape.
      context: ..
      dockerfile: diagnostics/Dockerfile
      args: { PACKAGE: issuer }
    command: ["uvicorn", "issuer.app:app", "--host", "0.0.0.0", "--port", "8003"]
    environment:
      # The same anchor every validator reads, and the reason it is shared rather than
      # restated: this service mints into the audience, issuer and role claim they check. A
      # second copy here is how an issuer starts minting tokens its own stack refuses.
      # AUTH_PUBLIC_KEY arrives with it and is ignored -- the public half is derived from the
      # signing key below, so the key set it serves cannot disagree with what signed.
      <<: *auth
      # No default, the same way AUTH_PUBLIC_KEY has none and for the same reason: a
      # committed signing key is a credential in the repository that mints admin tokens for
      # every checkout of it. Empty and this issuer mints nothing and serves an empty key
      # set. `make m1-demo` and the other demo targets set it from the same keypair they
      # configure AUTH_PUBLIC_KEY from; for a stack you bring up yourself, see .env.example.
      ISSUER_PRIVATE_KEY: "${ISSUER_PRIVATE_KEY:-}"
      # Two obviously-development accounts, and the passwords say so in the value. There is
      # no user store and no registration (§10.5), so the accounts are configuration --
      # which is also what makes swapping in a real issuer a configuration change. Roles are
      # exactly `admin` and `user`; a third value fails at startup rather than minting
      # tokens every service refuses.
      ISSUER_USERS: '${ISSUER_USERS:-{"operator-7":{"password":"operator-development","role":"user"},"quality-lead":{"password":"quality-lead-development","role":"admin"}}}'
      # Every number is configuration (§10.3). An hour is long enough that a question and its
      # follow-ups fit inside one token and short enough that a leaked one expires.
      ISSUER_TOKEN_LIFETIME_MINUTES: "${ISSUER_TOKEN_LIFETIME_MINUTES:-60}"
    # **edge-net, and nothing else.** It publishes no port, so the browser reaches it only
    # through the UI's own origin -- and the alternative, putting it on the internal
    # diag-net, would have forced the UI's nginx onto the network that holds Postgres. Of
    # the two containers that then gain reach, the browser-facing one is the wrong one to
    # widen. This service has no database and needs nothing diag-net offers.
    #
    # It must never reach field-net or anything of the plant's: the plant authenticates
    # separately and the two identity mechanisms stay disjoint by construction (§10.5,
    # CLAUDE.md's fifth invariant, plant/simulator/tests/test_identity_boundary.py).
    networks: [edge-net]

  ui:
    <<: *runtime
    build:
      # The repository root, because the build regenerates the UI's types from contracts/.
      context: ..
      dockerfile: diagnostics/ui/Dockerfile
    # nginx-unprivileged writes its temp paths under /tmp, which the shared block already
    # provides, and its pid to /tmp as well -- so read_only holds with no exceptions.
    user: "101:101"
    depends_on: [agent, analysis, issuer]
    ports:
      - "127.0.0.1:${UI_PORT:-5173}:8080"
    # It proxies to the agent and the analysis service by name, and has never heard of
    # OPC UA. edge-net for both, and never field-net.
    # Since M6 it also proxies the login form's POST to the issuer, which sits on edge-net
    # for exactly that reason -- so this container still joins one network, and the browser
    # -facing process stays off the internal one Postgres is on.
    networks: [edge-net]

volumes:
  diagnostics-db:
  gateway-queue:

networks:
  # Postgres lives here alone and is unreachable from outside the stack. internal also means
  # no container on it can publish a port, which is why the services that answer HTTP sit on
  # edge-net as well.
  diag-net:
    internal: true
  edge-net:
  field-net:
    external: true # exactly two containers join this, ever
