# The browser only ever talks to this origin. /api/* is forwarded to the two services here
# and by the Vite dev server in development, so neither service configures CORS and no API
# URL is baked into the bundle at build time.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Docker's embedded DNS. Naming it, and putting the upstream in a variable, is what
    # stops nginx resolving `agent` once at startup and refusing to start at all when the
    # agent happens to be down -- which would take the whole page with it, including the
    # part that has nothing to do with the agent. With a variable, a dead upstream is a 502
    # on one request instead.
    #
    # A variable in proxy_pass also switches off nginx's trailing-slash URI rewriting, so
    # each location captures the remaining path and passes it explicitly.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ ^/api/agent/(?<agent_path>.*)$ {
        set $agent http://agent:8001;
        proxy_pass $agent/$agent_path$is_args$args;
        # /ask is server-sent events: buffering it turns the stream back into a wait.
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
    }

    location ~ ^/api/analysis/(?<analysis_path>.*)$ {
        set $analysis http://analysis:8000;
        proxy_pass $analysis/$analysis_path$is_args$args;
    }

    # The development issuer, which publishes no port of its own, so the login form's POST
    # reaches it through this origin or not at all. It sits on edge-net beside this
    # container rather than on the internal diag-net, deliberately: the other arrangement
    # would have put the browser-facing process on the network that holds Postgres.
    location ~ ^/api/issuer/(?<issuer_path>.*)$ {
        set $issuer http://issuer:8003;
        proxy_pass $issuer/$issuer_path$is_args$args;
    }

    # Hashed filenames: the content cannot change under a given name, so cache it hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        # index.html is the one file that must NOT be cached: it names which hashed bundle to
        # load, so a cached copy serves yesterday's application from today's server. Observed
        # on the first redeploy, as a fix that was present in the image and absent in the
        # browser — which reads as "the fix does not work" and is not.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
