[project]
name = "simulator"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "asyncua==2.0.1",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
