name: machine-agent-plant

# Every service here runs as the identity that owns the bind-mounted `pki/` directory
# rather than the image's own 10001. The PKI is a host bind mount on purpose: the same
# certificate material has to be readable by the containers *and* by the host, because
# R3 rows 2 and 3 dial the plant from the host with the gateway's own identity, and
# `simulator.pki` writes private keys 0600. A single uid is the only arrangement in
# which the init container can write them, the server can read its own key, and the
# host can read the gateway's. Task 7's gateway must use the same uid for the same
# reason -- see .env.example.
x-runtime: &runtime
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  # The default json-file driver has no size limit and will fill a disk given a chatty
  # service and time (docs/ENGINEERING.md §7).
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # Not a `pre_start` hook on line-simulator, which is what the handbook prefers for
  # ephemeral setup: a hook shares its service's mounts, and line-simulator's `pki`
  # mount is read-only. Generating certificates is the one step here that needs to
  # write to it.
  pki-init:
    <<: *runtime
    build:
      context: .
      dockerfile: Dockerfile
      args: { PACKAGE: simulator }
    command: ["python", "-m", "simulator.pki", "/pki"]
    volumes:
      - ../pki:/pki
    networks: [plant-net]

  inspection-service:
    <<: *runtime
    build:
      context: .
      dockerfile: Dockerfile
      args: { PACKAGE: inspection }
    command:
      ["uvicorn", "inspection.app:app", "--host", "0.0.0.0", "--port", "8100"]
    env_file:
      - path: .env
        required: false
    healthcheck:
      # No curl in the image, and the healthcheck belongs in Compose rather than the
      # Dockerfile because it is environment-specific (§7).
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health').read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [plant-net] # never field-net: the truth side channel lives here

  line-simulator:
    <<: *runtime
    build:
      context: .
      dockerfile: Dockerfile
      args: { PACKAGE: simulator }
    command: ["python", "-m", "simulator.server"]
    # One name, including the container's own. Compose already aliases the service name
    # on every attached network, so this changes no routing; what it changes is
    # socket.gethostname(), which asyncua compares against its own certificate's DNS
    # SANs at startup. Left at Docker's default -- a twelve-hex container id -- the
    # server warns on every boot that its certificate does not cover its hostname,
    # which is exactly the message a real SAN mistake would produce.
    hostname: line-simulator
    depends_on:
      pki-init:
        condition: service_completed_successfully
      inspection-service:
        # service_healthy, not service_started: catch-up posts to /inspect from its
        # very first part, and uvicorn's port is open before the app can answer.
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # Restated here rather than left to simulator.config's defaults so that the one
      # name this boundary is built around is visible in the file that publishes the
      # port. test_compose_invariants.py pins these against each other and against the
      # certificate, so the restatement cannot drift.
      PLANT_ENDPOINT_URL: "opc.tcp://line-simulator:4840/plant"
      PLANT_APPLICATION_URI: "urn:machine-agent:plant:line-simulator"
      PLANT_INSPECTION_URL: "http://inspection-service:8100"
      PLANT_PKI_ROOT: "/pki"
      # The port the in-process HMI server binds (D5). Restated here, with the same
      # interpolation plant-hmi's nginx template is filled from, so that one value in the
      # environment moves the server and the proxy in front of it together. Left to
      # simulator.config's default on one side and a literal on the other, raising it
      # moved the server and left the screen proxying to where it used to be.
      # test_hmi.py pins both restatements against that default.
      PLANT_HMI_SERVER_PORT: "${PLANT_HMI_SERVER_PORT:-8200}"
    volumes:
      - ../pki:/pki:ro
      - plant-history:/data
    ports:
      # Identical inside and out. A published 14840:4840 would make the host dial a
      # port the server never advertises, which is §12's BadTcpEndpointUrlInvalid trap
      # verbatim. Bound to loopback explicitly: the bare `4840:4840` form binds
      # 0.0.0.0, and Docker's own NAT rules bypass a host firewall (§7), so the only
      # way to keep the plant off the LAN is not to publish it there.
      - "127.0.0.1:4840:4840"
    networks: [plant-net, field-net]

  # §15's plant HMI: the screen the line is built with. It serves a static bundle and
  # proxies /api/plant/* to the simulator's in-process HMI server -- it holds no state
  # of its own, and there is no second copy of what the line is doing anywhere.
  plant-hmi:
    <<: *runtime
    build:
      context: .
      dockerfile: hmi/Dockerfile
    # nginx-unprivileged writes its temp paths and its pid under /tmp. 101 rather than the
    # block's HOST_UID: this container never touches the bind-mounted pki/.
    user: "101:101"
    # The entrypoint renders /etc/nginx/templates/default.conf.template into conf.d at
    # start, and that is the one write this read_only container has to be able to make.
    # Nothing persists here -- it is regenerated on every start from the environment below.
    #
    # The long form rather than the shared block's `tmpfs: [/tmp]` short one, because this
    # mount needs a mode: a bare tmpfs comes up root-owned at 0775 and this container runs
    # as 101, so the entrypoint refused it with "conf.d is not writable" and nginx then
    # served its stock configuration -- a working web server for the wrong site. 1777 is
    # the same choice, for the same reason, as the plant image's /data: the uid cannot be
    # known at image build time. The short-form /tmp from the shared block still applies.
    volumes:
      - type: tmpfs
        target: /etc/nginx/conf.d
        tmpfs:
          mode: 01777
    environment:
      # What the template's ${PLANT_HMI_SERVER_PORT} becomes. Same interpolation as
      # line-simulator's own restatement above, so the two cannot name different ports.
      PLANT_HMI_SERVER_PORT: "${PLANT_HMI_SERVER_PORT:-8200}"
    depends_on: [line-simulator]
    ports:
      # Every number is configuration (§10.3), and the published port above all: the M1
      # demo could not run on the machine it was written on because 8080 was taken, so
      # this is read from the environment with a default rather than fixed here.
      - "127.0.0.1:${PLANT_HMI_PORT:-5174}:8080"
    # plant-net to resolve `line-simulator` and reach its HMI port; plant-edge to be
    # reachable from the host at all. Never field-net -- exactly two containers join
    # that, ever, and this one speaks HTTP to a screen rather than OPC UA to a gateway.
    networks: [plant-net, plant-edge]

volumes:
  plant-history:

networks:
  plant-net:
    internal: true
  # The plant's own edge network, and the reason it has to exist: an `internal` network
  # gets no port mapping at all, so a container attached only to plant-net cannot be
  # reached from the host however it is published. Measured, not assumed -- the same
  # container published the same way came back connection-refused on plant-net alone and
  # 200 with this second network attached. `edge-net` in diagnostics/compose.yml is the
  # same arrangement for the same reason. Nothing here crosses to the other stack.
  plant-edge:
  field-net:
    external: true # exactly two containers join this, ever
