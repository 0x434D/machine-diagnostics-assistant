[mypy]
strict = true

# `--strict` does not ban explicit `Any` — `x: Any` passes it silently, which would leave
# spec §10.8's "new code is typed" weaker than it reads (docs/ENGINEERING.md §2).
disallow_any_explicit = True

# Handbook §2 also says to add --num-workers. Deliberately not set: it is marked experimental
# in the pinned mypy 2.3.1, and the gate should not rest on an experimental parallel mode.

# asyncua's own __init__ modules re-export their public API (Server, Node, ua,
# EventGenerator, ObjectIds, ...) without listing it in __all__ -- that re-export *is*
# asyncua's documented import style (its own README imports this way), not an accident
# for us to route around. Strict's no_implicit_reexport otherwise treats every one of
# those names as private and fails on the first line that imports them. Scoped to the
# one third-party package that needs it, not project-wide.
[mypy-asyncua.*]
implicit_reexport = True

# inspection.app defines three pydantic.BaseModel subclasses (TruthIn, InspectIn,
# InspectOut). Each trips the same explicit-any false positive that
# simulator.config.Settings hits once -- pydantic's own metaclass takes **kwargs: Any
# in its __new__, which disallow_any_explicit attributes to the subclass statement,
# not to any annotation of ours. That module's comment named this exact situation
# ("the same exception at every future Pydantic row model") as the point to stop
# repeating a per-class `# type: ignore[explicit-any]` and scope it here instead.
[mypy-inspection.app]
disallow_any_explicit = False
