[mypy]
strict = true

# `--strict` does not ban explicit `Any` — `x: Any` passes it silently, which would leave
# spec §10.8's "new code is typed" weaker than it reads (docs/ENGINEERING.md §2).
disallow_any_explicit = True

# Handbook §2 also says to add --num-workers. Deliberately not set: it is marked experimental
# in the pinned mypy 2.3.1, and the gate should not rest on an experimental parallel mode.

# plant/simulator/tests/test_r5_runner.py imports run_r5 via the same sys.path.insert(...,
# ".../measurements") that lets it run at all -- measurements/ is outside every uv workspace
# (lint-python's comment on this same fact), so mypy needs its own way to find that module
# when it walks the plant workspace, or every invocation but the one that targets
# measurements/ directly reports import-not-found. $MYPY_CONFIG_FILE_DIR keeps this absolute
# regardless of which workspace's `cd` the gate runs mypy from.
mypy_path = $MYPY_CONFIG_FILE_DIR/measurements

# asyncua's own __init__ modules re-export their public API (Server, Node, ua,
# EventGenerator, ObjectIds, ...) without listing it in __all__ -- that re-export *is*
# asyncua's documented import style (its own README imports this way), not an accident
# for us to route around. Strict's no_implicit_reexport otherwise treats every one of
# those names as private and fails on the first line that imports them. Scoped to the
# one third-party package that needs it, not project-wide.
[mypy-asyncua.*]
implicit_reexport = True

# inspection.schemas defines three pydantic.BaseModel subclasses (TruthIn, InspectIn,
# InspectOut). Each trips the same explicit-any false positive that
# simulator.config.Settings hits once -- pydantic's own metaclass takes **kwargs: Any
# in its __new__, which disallow_any_explicit attributes to the subclass statement,
# not to any annotation of ours. That module's comment named this exact situation
# ("the same exception at every future Pydantic row model") as the point to stop
# repeating a per-class `# type: ignore[explicit-any]` and scope it here instead.
# Scoped to schemas.py rather than the whole inspection.app module (a prior review
# round of this file over-scoped it there) -- app.py itself has no BaseModel
# subclasses of its own and keeps the stricter default, so a handler added there that
# takes an untyped `Any` still fails the gate.
[mypy-inspection.schemas]
disallow_any_explicit = False

# analysis.models and analysis.config are the same pydantic situation the inspection.schemas
# override above documents: pydantic's metaclass takes **kwargs: Any in __new__, and
# disallow_any_explicit attributes that to the class statement rather than to any annotation
# of ours. Scoped to the two modules that define BaseModel/BaseSettings subclasses, so a
# handler or query added elsewhere in the package that takes an untyped Any still fails.
[mypy-analysis.models]
disallow_any_explicit = False

[mypy-analysis.config]
disallow_any_explicit = False

# auth.config is the same pydantic situation once more, and the only module in that package
# that declares a BaseSettings subclass. `tokens` and `requests` keep the stricter default,
# which matters more here than anywhere else: an `Any` on the path a claim takes out of a
# token is the one that would make a role check compare nothing to "admin".
[mypy-auth.config]
disallow_any_explicit = False

# testcontainers ships no py.typed marker. It is a test-only dependency that never appears in
# a signature of ours -- the fixtures it backs are annotated by hand -- so the untyped import
# is contained to the one line that constructs a container.
[mypy-testcontainers.*]
ignore_missing_imports = True

# agent.answer, agent.config and agent.app define the pydantic models §6.3 and §10.3 ask for,
# and hit the same metaclass false positive the two overrides above document. Scoped to the
# modules that declare models; the pipeline, the tool client and the providers keep the
# stricter default, so an untyped Any in the reasoning path still fails.
[mypy-agent.answer]
disallow_any_explicit = False

[mypy-agent.config]
disallow_any_explicit = False

[mypy-agent.app]
disallow_any_explicit = False

# mcp_server.config is the same pydantic situation once more, and the only module in that
# package that declares a BaseSettings subclass. The contract reader, the tool dispatch, the
# resources and the server keep the stricter default -- a tool argument typed `Any` on its way
# to the analysis service still fails the gate.
[mypy-mcp_server.config]
disallow_any_explicit = False
