name: weekly

# The two backstops that do not belong on a pull request: one because it needs full history,
# one because it must not be able to break an unrelated build at an arbitrary time.

on:
  schedule:
    # Monday 06:00 UTC. GitHub delays scheduled runs under load and disables them entirely on
    # a repository with no activity for 60 days — this is a backstop, not a clock.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Handbook §6: GitHub's own secret scanning is free and automatic on public repositories and
  # unavailable at any price for user-owned private ones. On a private repository this job is
  # the entire platform-independent defence, alongside the gitleaks pre-commit hook.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history. The point of this scan is the commits nobody is looking at.
          fetch-depth: 0
          persist-credentials: false
      - run: make secrets-scan

  # Directory.Build.props carves NuGet audit warnings (NU19xx) out of warnings-as-errors, so
  # that a CVE published overnight in a transitive dependency cannot fail an unrelated build
  # at 2am. This is the scheduled job that carve-out promises.
  nuget-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: make audit-dotnet

  # Moved off the PR gate for the same reason as nuget-audit above: the scan's verdict is a
  # function of Trivy's database refresh, not of the diff, so on a pull request it fails for
  # things no commit in it caused. Here a red run means the images need patching.
  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            plant/uv.lock
            diagnostics/uv.lock
      - run: make scan-images
