components:
  schemas:
    Coverage:
      description: "\xA74.4: without gap markers, missing data is indistinguishable from a quiet machine."
      properties:
        gaps:
          items:
            $ref: '#/components/schemas/Gap'
          title: Gaps
          type: array
      required:
      - gaps
      title: Coverage
      type: object
    DefectClassCount:
      properties:
        count:
          title: Count
          type: integer
        defect_class:
          title: Defect Class
          type: string
      required:
      - defect_class
      - count
      title: DefectClassCount
      type: object
    Gap:
      properties:
        from_ts:
          format: date-time
          title: From Ts
          type: string
        reason:
          title: Reason
          type: string
        to_ts:
          format: date-time
          title: To Ts
          type: string
      required:
      - from_ts
      - to_ts
      - reason
      title: Gap
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    InspectionStats:
      properties:
        by_defect_class:
          items:
            $ref: '#/components/schemas/DefectClassCount'
          title: By Defect Class
          type: array
        coverage:
          $ref: '#/components/schemas/Coverage'
        rejects:
          title: Rejects
          type: integer
        sample_serials:
          items:
            type: string
          title: Sample Serials
          type: array
        total:
          title: Total
          type: integer
        window:
          $ref: '#/components/schemas/Window'
      required:
      - window
      - total
      - rejects
      - by_defect_class
      - sample_serials
      - coverage
      title: InspectionStats
      type: object
    Part:
      properties:
        assembly_serial:
          title: Assembly Serial
          type: string
        confidence:
          anyOf:
          - type: number
          - type: 'null'
          title: Confidence
        defect_class:
          anyOf:
          - type: string
          - type: 'null'
          title: Defect Class
        image_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Url
        model_version:
          title: Model Version
          type: string
        result:
          title: Result
          type: string
        source_ts:
          format: date-time
          title: Source Ts
