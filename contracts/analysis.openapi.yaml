info:
  title: machine-agent analysis
  version: 0.1.0
openapi: 3.1.0
paths:
  /inspection/stats:
    get:
      description: Counts over a closed window, with the gaps that make them incomplete.
      operationId: inspectionStats
      parameters:
      - in: query
        name: from
        required: true
        schema:
          format: date-time
          title: From
          type: string
      - in: query
        name: to
        required: true
        schema:
          format: date-time
          title: To
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectionStats'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Inspection Stats
  /parts/{serial}:
    get:
      description: "Reads the per-part record directly.\n\n\xA73.4a: that record is authoritative for\
        \ the part and is never reconstructed by joining\nthe time series on \"which part was at S3 at\
        \ 02:14:07\" \u2014 with buffers, variable takt and\nhistory gaps that association is an inference,\
        \ and inferred traceability is what makes a\ncontainment list unusable at the moment it matters.\
        \ There is no time-range join here."
      operationId: getPart
      parameters:
      - in: path
        name: serial
        required: true
        schema:
          title: Serial
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Part'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Part
  /parts/{serial}/image:
    get:
      description: "Rejects only. A good part has no image and that is not a missing value (\xA73.4)."
      operationId: getPartImage
      parameters:
      - in: path
        name: serial
        required: true
        schema:
          title: Serial
          type: string
      responses:
        '200':
          content:
            image/png: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Part Image
